services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: opensource_matcher
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    working_dir: /var/www/html
    command: sh -c "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"
    env_file:
      - ./backend/.env
    ports:
      - "8000"
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pg_data:
