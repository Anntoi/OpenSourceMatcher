name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, pdo_pgsql
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Setup Laravel env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test --no-coverage


  build-frontend:
    runs-on: ubuntu-latest
    needs: build-backend

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: https://opensourcematcher-api.onrender.com/api/v1

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist


  deploy:
    runs-on: ubuntu-latest
    needs: build-frontend

    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.ENABLE_DEPLOY == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      # =========================
      # INSTALL VERCEL CLI
      # =========================
      - name: Install Vercel CLI
        run: npm install -g vercel

      # =========================
      # DEPLOY TO VERCEL
      # =========================
      - name: Deploy to Vercel
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy --prod --token=$VERCEL_TOKEN --yes)
          echo "deploy_url=$DEPLOY_URL" >> $GITHUB_OUTPUT
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # =========================
      # HEALTH CHECK SIMPLE
      # =========================
      - name: Check deployment health
        id: check
        run: |
          STATUS_CODE=$(curl -o /dev/null -s -w "%{http_code}" ${{ steps.deploy.outputs.deploy_url }})

          if [ "$STATUS_CODE" -ge 400 ]; then
            echo "status=failed" >> $GITHUB_OUTPUT
          else
            echo "status=success" >> $GITHUB_OUTPUT
          fi

      # =========================
      # ROLLBACK VERCEL
      # =========================
      - name: Rollback Vercel if failed
        if: steps.check.outputs.status == 'failed'
        run: |
          echo "⚠️ Deployment failed, starting rollback..."

          PREVIOUS=$(vercel ls --token=$VERCEL_TOKEN --scope=$VERCEL_ORG_ID \
            | grep READY \
            | head -n 1 \
            | awk '{print $1}')

          if [ -n "$PREVIOUS" ]; then
            vercel promote $PREVIOUS --token=$VERCEL_TOKEN
            echo "✅ Rolled back to $PREVIOUS"
          else
            echo "❌ No previous deployment found"
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

      # =========================
      # RENDER BACKEND DEPLOY
      # =========================
      - name: Trigger Render deploy
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
          else
            echo "⚠️ Render deploy skipped"
          fi
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}